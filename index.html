<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermela | Digital Home</title>
  
  <!-- Google Fonts: Cinzel Decorative & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS Play CDN (Enables full styling instantly on mobile/GitHub Pages without a compiler) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gallery: {
              alabaster: '#F6F5F0', 
              charcoal:  '#121110', 
              cashmere:  '#ECEAE1', 
              bronze:    '#A38F78', 
            },
            abyssal: {
              void:      '#09090B', 
              offwhite:  '#E4E4E7', 
              structure: '#18181B', 
              oxidized:  '#8C7A6B', 
            }
          },
          fontFamily: {
            display: ['"Cinzel Decorative"', 'serif'],
            sans: ['Inter', 'sans-serif'], 
          },
          letterSpacing: {
            widest: '.2em', 
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gallery-alabaster text-gallery-charcoal dark:bg-abyssal-void dark:text-abyssal-offwhite transition-colors duration-700 antialiased font-sans selection:bg-gallery-bronze selection:text-white dark:selection:bg-abyssal-oxidized">

  <main class="relative min-h-screen flex flex-col justify-between px-6 py-8 md:px-12 md:py-12">
    
    <!-- TOP NAVIGATION -->
    <header class="flex justify-between items-center z-10 uppercase tracking-widest text-xs md:text-sm font-medium">
      <div class="flex gap-8">
        <a href="index.html" class="border-b border-gallery-charcoal dark:border-abyssal-offwhite pb-1">Home</a>
        <a href="about.html" class="hover:text-gallery-bronze dark:hover:text-abyssal-oxidized transition-colors">About</a>
        <a href="projects.html" class="hover:text-gallery-bronze dark:hover:text-abyssal-oxidized transition-colors">Works</a>
      </div>
      
      <button id="theme-toggle" class="hover:text-gallery-bronze dark:hover:text-abyssal-oxidized transition-colors duration-300 focus:outline-none">
        <span class="dark:hidden">Dark Mode</span>
        <span class="hidden dark:inline">Light Mode</span>
      </button>
    </header>

    <!-- CENTER PIECE: WORDMARK -->
    <section class="flex-grow flex flex-col items-center justify-center z-10 text-center">
      <h1 class="font-display text-5xl md:text-8xl lg:text-[10rem] leading-none">
        HERMELA
      </h1>
      <p class="mt-6 text-sm md:text-base max-w-md opacity-80 tracking-wide font-light">
        The Polymath of Algorithmic Elegance
      </p>
    </section>

    <!-- BOTTOM ANCHOR -->
    <footer class="flex justify-center z-10">
      <a href="about.html" class="text-xs tracking-widest uppercase animate-pulse hover:text-gallery-bronze transition-colors">
        Scroll to Explore
      </a>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
